<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Annual Report Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12233D;
    --parchment: #FAF7F0;
    --gold: #B08D3F;
    --charcoal: #2A2A28;
    --sage: #E4E1D8;
    --line: #D8D3C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--parchment);
    color: var(--charcoal);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.6rem;
    color: var(--ink);
    margin: 0 0 4px;
  }

  header p {
    margin: 0;
    font-size: 0.88rem;
    color: #6B6558;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .thread {
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 0.95rem;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--ink);
    color: var(--parchment);
    border-bottom-right-radius: 2px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--sage);
    color: var(--charcoal);
    border-bottom-left-radius: 2px;
  }

  .msg.assistant.loading {
    color: #7A7566;
    font-style: italic;
  }

  .sources {
    align-self: flex-start;
    max-width: 88%;
    margin-top: -8px;
  }

  .sources summary {
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--gold);
    font-weight: 500;
    list-style: none;
  }

  .sources summary::-webkit-details-marker { display: none; }

  .sources summary::before {
    content: "Sources ";
  }

  .sources[open] summary::before {
    content: "Hide sources ";
  }

  .source-card {
    border-left: 2px solid var(--gold);
    padding: 8px 12px;
    margin-top: 8px;
    background: #FFFDF8;
    font-size: 0.82rem;
    color: #5C5748;
  }

  .source-card .page-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--line);
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }

  #input-bar {
    border-top: 1px solid var(--line);
    padding: 16px;
    background: var(--parchment);
  }

  #input-form {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }

  #question {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    background: white;
    color: var(--charcoal);
  }

  #question:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  button {
    padding: 12px 20px;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    cursor: pointer;
  }

  button:disabled {
    background: #9A9789;
    cursor: not-allowed;
  }

  .empty-state {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: #8A8570;
  }

  .empty-state p {
    font-size: 0.9rem;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>ASX Annual Report Assistant</h1>
  <p>Ask questions about ASX Limited's FY2025 Annual Report — every answer cites its page</p>
</header>

<div id="chat">
  <div class="thread" id="thread">
    <div class="empty-state" id="empty-state">
      <p>Try asking: "What was the operating revenue in FY25?" or "What was the total dividend per share?"</p>
    </div>
  </div>
</div>

<div id="input-bar">
  <form id="input-form">
    <input type="text" id="question" placeholder="Ask a question about the annual report..." autocomplete="off" />
    <button type="submit" id="ask-btn">Ask</button>
  </form>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000/ask"; // change to your deployed API URL later

  const form = document.getElementById('input-form');
  const input = document.getElementById('question');
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const askBtn = document.getElementById('ask-btn');

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    thread.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addSources(sources) {
    const details = document.createElement('details');
    details.className = 'sources';
    const summary = document.createElement('summary');
    details.appendChild(summary);

    sources.forEach(src => {
      const card = document.createElement('div');
      card.className = 'source-card';
      const tag = document.createElement('span');
      tag.className = 'page-tag';
      tag.textContent = `Page ${src.page}`;
      const excerpt = document.createElement('div');
      excerpt.textContent = src.excerpt;
      card.appendChild(tag);
      card.appendChild(document.createElement('br'));
      card.appendChild(excerpt);
      details.appendChild(card);
    });

    thread.appendChild(details);
    scrollToBottom();
  }

  function scrollToBottom() {
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    if (emptyState) emptyState.remove();

    addMessage('user', question);
    input.value = '';
    askBtn.disabled = true;

    const loadingMsg = addMessage('assistant loading', 'Searching the report...');

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });

      if (!response.ok) throw new Error(`Server responded with ${response.status}`);

      const data = await response.json();
      loadingMsg.remove();
      addMessage('assistant', data.answer);
      if (data.sources && data.sources.length) {
        addSources(data.sources);
      }
    } catch (err) {
      loadingMsg.remove();
      addMessage('assistant', `Could not reach the assistant. Make sure the API is running. (${err.message})`);
    } finally {
      askBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
